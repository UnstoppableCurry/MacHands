# 放进现有 server {} 里,**要在 location /api/ 之前**(nginx 按最长前缀匹配,
# /api/store/ 比 /api/ 长,所以它会赢;写在前面只是为了看得清)。
#
# 关键几点:
#   - 不要开任何会改写请求体的东西(gzip 请求体、sub_filter…),验签靠原始字节。
#   - underscores_in_headers 默认关着;三家的签名头都是连字符,不受影响。
#   - webhook 体不大,1 MiB 够了;超了让 nginx 直接拒,别打到 node。

location /api/store/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 请求体原封不动传过去
    proxy_request_buffering off;
    client_max_body_size 1m;

    # 发信可能慢,但我们是先回 200 再发信,所以 30 秒足够
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # webhook 不该被缓存
    add_header Cache-Control "no-store" always;
}
